name: InnoGym
version: "0.3.1"
slug: innodigym
description: Keeps your INNODIGYM Power workouts in Home Assistant and shows your progress.
url: https://github.com/dalocar/innodigym-ha
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8787
panel_icon: mdi:dumbbell
panel_title: InnoGym
services:
  - mqtt:need
options:
  sync_interval_minutes: 10
  discovery_prefix: homeassistant
  users: []
  timezone: ""
schema:
  sync_interval_minutes: int(5,120)
  discovery_prefix: str
  timezone: str?
  users:
    - name: str
      ha_user: str?
      innogym_email: email?
      innogym_password: password?
      hevy_api_key: password?
      hevy_since: match(^\d{4}-\d{2}-\d{2}$)?
      hevy_actions: str?
