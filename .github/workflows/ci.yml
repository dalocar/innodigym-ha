name: CI

# Runs on PRs (including from forks) with a read-only token and NO secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Python tests
        run: python3 -m unittest discover -s tests
      - name: Frontend tests
        run: node --test innodigym/app/static/*.test.js
      - name: Add-on image builds
        run: docker build -t innodigym-addon-test innodigym
